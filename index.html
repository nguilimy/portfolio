<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hamid Ahmat | Web, Mobile & Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Hamid Ahmat, Computer Science & Data Science student in Kigali building websites, mobile apps, APIs and ML projects." />
    <meta name="theme-color" content="#070a10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Link preview (WhatsApp, LinkedIn, X, Facebook…). Site address comes from .env → VITE_SITE_URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hamid Ahmat" />
    <meta property="og:title" content="Hamid Ahmat | Web, Mobile & Full-Stack Developer" />
    <meta property="og:description" content="Computer Science & Data Science student in Kigali building websites, mobile apps, APIs and ML projects with React, React Native, TypeScript, Node.js & Python." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hamid Ahmat, Web, Mobile & Full-Stack Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hamid Ahmat | Web, Mobile & Full-Stack Developer" />
    <meta name="twitter:description" content="Websites, mobile apps, APIs and ML projects with React, React Native, TypeScript, Node.js & Python." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <script>
      // Apply saved (or system) theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t

        var c = localStorage.getItem('portfolio-color-theme')
        if (c) {
          var parsed = JSON.parse(c)
          if (parsed && parsed.accent && parsed.accent2) {
            document.documentElement.style.setProperty('--accent', parsed.accent)
            document.documentElement.style.setProperty('--accent-2', parsed.accent2)
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
